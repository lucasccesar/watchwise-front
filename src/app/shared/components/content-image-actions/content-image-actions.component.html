<div class="content-menu-anchor" [class.menu-expanded]="menuExpanded()">
  @if (ratingValue !== null) {
    <span class="home-item-rating" [attr.aria-label]="ratingLabel">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m7-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
        <path d="m19 3 1.2 2.4 2.7.4-2 1.9.5 2.7-2.4-1.3-2.4 1.3.5-2.7-2-1.9 2.7-.4z" />
      </svg>
      {{ ratingValue }}
    </span>
  }

  <button
    #trigger
    class="content-menu-trigger"
    type="button"
    [attr.aria-label]="optionsLabel"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuExpanded()"
    (click)="toggleMenu($event)"
   data-ww-ellipsis-trigger>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="5" cy="12" r="2" />
      <circle cx="12" cy="12" r="2" />
      <circle cx="19" cy="12" r="2" />
    </svg>
  </button>

  @if (menuExpanded()) {
    <div
      class="content-dropdown-menu"
      role="menu" data-ww-menu
      [attr.aria-label]="optionsLabel"
      [style.position]="menuPosition ? 'fixed' : null"
      [style.top.px]="menuPosition?.top ?? null"
      [style.left.px]="menuPosition?.left ?? null"
      [style.right]="menuPosition ? 'auto' : null"
    >
      @for (action of actions; track action.id) {
        <button
          class="content-dropdown-item"
          type="button"
          role="menuitem" data-ww-menu-item
          [disabled]="action.disabled"
          (click)="selectAction(action, $event)"
        >
          @if (action.icon === 'check') {
            <app-check-icon [color]="'var(--color-primary)'" />
          } @else {
            <svg viewBox="0 0 24 24" [attr.data-icon]="action.icon" aria-hidden="true">
              @switch (action.icon) {
              @case ('star') {
                <path d="M11.283 3.453C11.513 2.986 11.628 2.753 11.785 2.678C11.921 2.613 12.079 2.613 12.216 2.678C12.372 2.753 12.487 2.986 12.717 3.453L14.904 7.883C14.972 8.021 15.006 8.09 15.056 8.143C15.1 8.191 15.153 8.229 15.211 8.256C15.278 8.287 15.354 8.298 15.506 8.321L20.397 9.035C20.912 9.111 21.169 9.148 21.288 9.274C21.391 9.383 21.44 9.533 21.42 9.682C21.398 9.853 21.211 10.035 20.839 10.398L17.3 13.844C17.19 13.951 17.135 14.005 17.1 14.069C17.068 14.125 17.048 14.187 17.04 14.251C17.031 14.323 17.044 14.399 17.07 14.551L17.905 19.417C17.993 19.93 18.037 20.187 17.954 20.339C17.882 20.472 17.754 20.564 17.606 20.592C17.436 20.623 17.206 20.502 16.745 20.26L12.372 17.96C12.236 17.888 12.168 17.853 12.097 17.839C12.034 17.826 11.968 17.826 11.905 17.839C11.833 17.853 11.765 17.888 11.629 17.96L7.256 20.26C6.795 20.502 6.565 20.623 6.395 20.592C6.247 20.564 6.119 20.472 6.047 20.339C5.964 20.187 6.008 19.93 6.096 19.417L6.931 14.551C6.957 14.399 6.97 14.323 6.961 14.251C6.953 14.187 6.933 14.125 6.901 14.069C6.866 14.005 6.811 13.951 6.701 13.844L3.162 10.398C2.79 10.035 2.603 9.853 2.581 9.682C2.561 9.533 2.61 9.383 2.713 9.274C2.832 9.148 3.089 9.111 3.604 9.035L8.495 8.321C8.647 8.298 8.723 8.287 8.79 8.256C8.848 8.229 8.901 8.191 8.945 8.143C8.995 8.09 9.029 8.021 9.097 7.883L11.283 3.453Z" />
              }
              @case ('eye') {
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              }
              @case ('trash') {
                <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6" />
              }
              @case ('ban') {
                <circle cx="12" cy="12" r="10" />
                <path d="m5 5 14 14" />
              }
              @case ('rewatch') {
                <path d="M2 10s2-2.7 3.6-4.4A9 9 0 1 1 3.4 14.5M2 10V4m0 6h6" />
              }
              @case ('share') {
                <circle cx="18" cy="5" r="3" />
                <circle cx="6" cy="12" r="3" />
                <circle cx="18" cy="19" r="3" />
                <path d="m8.7 10.7 6.6-4.4m-6.6 7 6.6 4.4" />
              }
              @case ('bookmark') {
                <path d="M6 4h12v17l-6-3.5L6 21V4Z" />
              }
              @case ('bookmark-filled') {
                <path d="M6 4h12v17l-6-3.5L6 21V4Z" />
              }
              @case ('list') {
                <path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01" />
              }
              }
            </svg>
          }
          <span>{{ action.label }}</span>
        </button>
      }
    </div>
  }
</div>
