<div class="public-shell">
  <header class="public-header">
    <a class="brand" routerLink="/login">
      <img src="/watchwise-logo.svg" alt="Watchwise" width="126" height="24" />
    </a>
  </header>

  <main class="public-main">
    <router-outlet />
  </main>

  <footer class="public-footer">
    <nav class="public-footer-nav" [attr.aria-label]="footerCopy.navLabel">
      @for (link of footerLinks; track link.path; let last = $last) {
        <a class="public-footer-link" [routerLink]="link.path">{{ link.label }}</a>
        @if (!last) {
          <span class="public-footer-separator" aria-hidden="true">·</span>
        }
      }
    </nav>
  </footer>
</div>
