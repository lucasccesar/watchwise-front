<section class="profile-country-section" aria-label="{{ title }}">
  <header class="profile-country-heading">
    <div>
      <h2>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h20M12 2c2.5 2.74 3.92 6.29 4 10-.08 3.71-1.5 7.26-4 10-2.5-2.74-3.92-6.29-4-10 .08-3.71 1.5-7.26 4-10Zm10 0C22 12 17.52 22 12 22 6.48 22 2 17.52 2 12S6.48 2 12 2Z" /></svg>
        {{ title }}
      </h2>
      @if (description) { <p>{{ description }}</p> }
    </div>
  </header>

  <div class="profile-country-content">
    <div class="profile-country-map" role="img" aria-label="Mapa-múndi de países de origem">
      <svg viewBox="0 0 960 440" aria-hidden="true" focusable="false">
        <g class="profile-country-land">
          <path d="m57 86 29-12 19-18 37-8 23 8 22-7 33 9 29 18 12 19-11 17-23 8-13 17-19 3-12 14-20-3-9 14-16 5-7 20-14-6-11-18-21-4-10-16-20-4-11-13-15-4-7-18z" />
          <path d="m251 197 22 8 16 17 11 22-4 23-12 22-6 30-11 27-13 29-14-12-7-26-13-24 4-20-10-22 8-23-2-21 13-14z" />
          <path d="m180 50 17-10 23 4 13 12-10 14-20 2-17-8z" />
          <path d="m421 95 14-13 21 1 11 11-8 14-23 4-17-7z" />
          <path d="m457 120 20-17 31-7 22-14 39 4 25-12 43 6 29-7 32 12 27-3 25 16 30 6 16 16-8 16-22 2-14 18-24 3-16 17-22-5-18 12-23-7-21 12-27-8-16 15-20-4-12 22-16-5-14-20-20-8-14-17-20 2-19-12-19 3-15-16z" />
          <path d="m456 185 25-8 28 9 17 20-4 27 9 20-17 29-8 31-18 31-15 12-14-19-7-33-14-23 5-22-11-19 7-24-5-20z" />
          <path d="m551 165 14 1 9 15-13 11-14-10z" />
          <path d="m596 174 17 4 13 20 18 9 4 20-14 8-15-14-18-5-10-18z" />
          <path d="m690 189 20 8 16 16 22 4 18 18-12 14-26-4-19-15-20-7-9-17z" />
          <path d="m716 236 18 5 16 14-9 14-20-5-12-13z" />
          <path d="m837 300 29-8 29 8 19 16-8 18-25 4-19-9-23 1-16-15z" />
          <path d="m908 122 8-4 5 11-7 9-8-5z" />
          <path d="m777 287 8-6 7 9-5 13-8-2z" />
          <path d="m797 304 7-4 6 8-8 7z" />
          <path d="m813 309 6-3 5 7-7 6z" />
        </g>
      </svg>
      <div class="profile-country-map-legend"><span>Menos</span><i></i><i></i><i></i><i></i><i></i><span>Mais</span></div>
    </div>

    <div class="profile-country-list">
      @for (country of countries; track country.country) {
        <div class="profile-country-row">
          <div class="profile-country-label"><span>{{ country.country }}</span><strong>{{ country.count }}</strong></div>
          <div class="profile-country-track"><i [style.width]="width(country.count)"></i></div>
        </div>
      } @empty {
        <p class="profile-country-empty">{{ emptyText }}</p>
      }
    </div>
  </div>
</section>
