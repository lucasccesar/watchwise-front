<section class="login" aria-labelledby="login-title">
  <div class="login-heading">
    <h1 id="login-title">{{ copy.title }}</h1>
    <p>{{ copy.subtitle }}</p>
  </div>

  <div class="login-card">
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      (input)="clearStatus()"
      [attr.aria-label]="copy.formLabel"
      novalidate
    >
      <div class="field-group">
        <label for="login-email">{{ copy.emailLabel }}</label>
        <input
          id="login-email"
          type="email"
          required
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          spellcheck="false"
          [placeholder]="copy.emailPlaceholder"
          [class.input-invalid]="emailError()"
          [attr.aria-invalid]="emailError() !== null"
          [attr.aria-describedby]="emailError() ? 'login-email-error' : null"
        />
        @if (emailError(); as error) {
          <p class="field-error" id="login-email-error">
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 8v4m0 4h.01" />
            </svg>
            <span>{{ error }}</span>
          </p>
        }
      </div>

      <div class="field-group">
        <div class="password-label-row">
          <label for="login-password">{{ copy.passwordLabel }}</label>
          <a class="text-link" routerLink="/forgot-password">{{ copy.forgotPassword }}</a>
        </div>
        <div class="password-field" [class.input-invalid]="passwordError()">
          <input
            id="login-password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            required
            autocomplete="current-password"
            [placeholder]="copy.passwordPlaceholder"
            [attr.aria-invalid]="passwordError() !== null"
            [attr.aria-describedby]="passwordError() ? 'login-password-error' : null"
          />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword() ? copy.hidePassword : copy.showPassword"
            [attr.aria-pressed]="showPassword()"
            (click)="togglePassword()"
          >
            @if (showPassword()) {
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c5.1 0 8.5 4.5 9.6 6.3a1.4 1.4 0 0 1 0 1.4 15 15 0 0 1-2.3 2.8M6.2 6.2a16 16 0 0 0-3.8 5.1 1.4 1.4 0 0 0 0 1.4C3.5 14.5 6.9 19 12 19a10 10 0 0 0 4.5-1.1" />
              </svg>
            } @else {
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2.4 12.7a1.4 1.4 0 0 1 0-1.4C3.5 9.5 6.9 5 12 5s8.5 4.5 9.6 6.3a1.4 1.4 0 0 1 0 1.4C20.5 14.5 17.1 19 12 19s-8.5-4.5-9.6-6.3Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
        @if (passwordError(); as error) {
          <p class="field-error" id="login-password-error">
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 8v4m0 4h.01" />
            </svg>
            <span>{{ error }}</span>
          </p>
        }
      </div>

      <div class="auth-terms">
        <div class="auth-checkbox-row">
          <input id="login-remember" type="checkbox" formControlName="remember" />
          <label for="login-remember">{{ copy.rememberLabel }}</label>
        </div>
      </div>

      @if (serverError(); as error) {
        <p class="form-message form-message--error" role="alert">{{ error }}</p>
      }

      <button class="submit-button" type="submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="auth-loading-spinner" aria-hidden="true"></span>
        }
        {{ isSubmitting() ? copy.submitting : copy.submit }}
      </button>

      <div class="auth-divider" role="separator" [attr.aria-label]="copy.or">
        <span aria-hidden="true"></span>
        <span>{{ copy.or }}</span>
        <span aria-hidden="true"></span>
      </div>

      @if (googleClientId) {
        <div class="google-button-host" #googleButtonHost></div>
      } @else {
        <button class="google-button" type="button" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.81Z" />
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.9l-3.88-3.02c-1.07.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.72-4.95H1.27v3.11A12 12 0 0 0 12 24Z" />
            <path fill="#FBBC05" d="M5.28 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.38-2.28V6.61H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4.01-3.11Z" />
            <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.61l4.01 3.11C6.22 6.88 8.87 4.77 12 4.77Z" />
          </svg>
          <span>{{ copy.googleButton }}</span>
        </button>
      }
    </form>
  </div>

  <p class="sign-up-prompt">
    {{ copy.noAccount }}
    <a class="text-link" routerLink="/register">{{ copy.signUp }}</a>
  </p>
</section>
