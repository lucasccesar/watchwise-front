<!-- @dsCard group="Navigation" height=220 subtitle="Account menu" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dropdown Menu — preview</title>
<style>
  html, body { margin:0; }
  body { background:var(--surface); color:var(--text); font-family:var(--font-sans); padding:var(--space-6); }
  .panel { width:220px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); overflow:hidden; box-shadow:var(--shadow-md); }
  .head { display:flex; gap:8px; align-items:center; padding:12px; border-bottom:1px solid var(--border); }
  .avatar { width:32px; height:32px; border-radius:50%; background:var(--secondary); flex:none; }
  .name { font-size:14px; font-weight:600; }
  .email { font-size:12px; color:var(--tertiary); }
  .item { padding:10px 12px; font-size:14px; }
  .item.hover { background:var(--surface-secondary); }
  .divider { border-top:1px solid var(--border); }
</style>
</head>
<body>
<div class="panel">
  <div class="head"><span class="avatar"></span><div><div class="name">Lucas Cesar</div><div class="email">lucas@watchwise.app</div></div></div>
  <div class="item hover">My profile</div>
  <div class="item">Settings</div>
  <div class="divider"></div>
  <div class="item">Log out</div>
</div>
<script>/* static preview */</script>
</body>
</html>
