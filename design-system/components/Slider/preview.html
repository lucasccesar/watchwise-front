<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slider — preview</title>
<style>
  html, body { margin:0; }
  body { background:var(--surface); color:var(--text); font-family:var(--font-sans); padding:var(--space-6); }
  .track { width:220px; height:4px; border-radius:999px; background:var(--surface-secondary); position:relative; }
  .fill { width:60%; height:100%; border-radius:999px; background:var(--primary); }
  .handle { position:absolute; top:50%; left:60%; width:16px; height:16px; border-radius:50%; background:var(--text); border:2px solid var(--primary); transform:translate(-50%,-50%); }
</style>
</head>
<body>
<div class="track"><div class="fill"></div><div class="handle"></div></div>
<script>/* static preview */</script>
</body>
</html>
