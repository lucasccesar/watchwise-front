<!-- @dsCard group="Communication" height=180 subtitle="Received and sent — conditional use, see README" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Messaging — preview</title>
<style>
  html, body { margin:0; }
  body { background:var(--surface); color:var(--text); font-family:var(--font-sans); padding:var(--space-6); }
  .msg { max-width:220px; padding:8px 12px; border-radius:12px; font-size:13px; margin-bottom:10px; }
  .in { background:var(--surface-secondary); border-bottom-left-radius:4px; }
  .out { background:var(--primary); margin-left:auto; border-bottom-right-radius:4px; }
  .ts { font-size:10px; color:var(--tertiary); margin-top:2px; }
</style>
</head>
<body>
<div class="msg in">Have you seen the season finale?</div>
<div class="ts">14:02</div>
<div class="msg out">Not yet, no spoilers 😅</div>
<script>/* static preview */</script>
</body>
</html>
