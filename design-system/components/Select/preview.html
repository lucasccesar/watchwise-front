<!-- @dsCard group="Form" height=220 subtitle="Open trigger with list" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select — preview</title>
<style>
  html, body { margin:0; }
  body { background:var(--surface); color:var(--text); font-family:var(--font-sans); padding:var(--space-6); }
  .wrap { max-width:240px; }
  label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  .trigger { display:flex; justify-content:space-between; align-items:center; border:1px solid var(--primary); border-radius:var(--radius-md); padding:10px 12px; font-size:14px; }
  .panel { margin-top:4px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); overflow:hidden; box-shadow:var(--shadow-md); }
  .item { display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:14px; }
  .item.hover { background:var(--surface-secondary); }
  .item.sel { color:var(--primary); font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <label>Status</label>
  <div class="trigger"><span>Watching</span><span>▾</span></div>
  <div class="panel">
    <div class="item sel">✓ Watching</div>
    <div class="item hover"><span class="dot"></span> Completed</div>
    <div class="item">Dropped</div>
  </div>
</div>
<script>/* static preview */</script>
</body>
</html>
