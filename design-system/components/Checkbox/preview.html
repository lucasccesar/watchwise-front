<!-- @dsCard group="Form" height=140 subtitle="Unchecked, checked, indeterminate" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkbox — preview</title>
<style>
  html, body { margin:0; }
  body { background:var(--surface); color:var(--text); font-family:var(--font-sans); padding:var(--space-6); }
  .row { display:flex; align-items:center; gap:var(--space-3); margin-bottom:var(--space-3); }
  .box { width:18px; height:18px; border-radius:4px; border:1px solid var(--border); display:inline-flex; align-items:center; justify-content:center; background:var(--surface); font-size:12px; color:var(--text); flex:none; }
  .box.checked, .box.indeterminate { background:var(--primary); border-color:var(--primary); }
  label { font-size:14px; }
</style>
</head>
<body>
<div class="row"><span class="box"></span><label>Not started</label></div>
<div class="row"><span class="box checked">✓</span><label>Checked</label></div>
<div class="row"><span class="box indeterminate">–</span><label>Indeterminate</label></div>
<script>/* static preview */</script>
</body>
</html>
