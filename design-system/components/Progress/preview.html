<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress — preview</title>
<style>
  html, body { margin:0; }
  body { background:var(--surface); color:var(--text); font-family:var(--font-sans); padding:var(--space-6); display:flex; align-items:center; gap:var(--space-8); }
  .bar-wrap { width:200px; }
  .bar { height:6px; border-radius:999px; background:var(--surface-secondary); overflow:hidden; }
  .fill { width:68%; height:100%; background:var(--primary); }
  .lbl { font-size:12px; color:var(--tertiary); margin-top:6px; }
  svg { transform:rotate(-90deg); }
</style>
</head>
<body>
<div class="bar-wrap">
  <div class="bar"><div class="fill"></div></div>
  <div class="lbl">8 of 12 episodes · 68%</div>
</div>
<svg width="64" height="64">
  <circle cx="32" cy="32" r="26" fill="none" stroke="var(--surface-secondary)" stroke-width="6"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="var(--primary)" stroke-width="6" stroke-dasharray="163" stroke-dashoffset="52" stroke-linecap="round"/>
</svg>
<script>/* static preview */</script>
</body>
</html>
